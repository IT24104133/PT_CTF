<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | rootCapture</title>
  <meta name="theme-color" content="#02060d">
  <link rel="icon" href="/platform/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/platform/platform.css">
  <script src="/platform/common.js" defer></script>
  <script src="/platform/dashboard.js" defer></script>
</head>
<body>
  <main class="page" id="app">
    <div class="page-head">
      <div>
        <h1 id="greeting">Dashboard</h1>
        <p id="subline">Loading your progress ...</p>
      </div>
      <span class="live" id="live"><i></i>Live</span>
    </div>
    <div id="banner"></div>
    <section class="grid cols-4" id="tiles" aria-label="Your stats"></section>
    <section class="panel" aria-labelledby="progress-h">
      <div class="panel-head">
        <h2 id="progress-h">Progress</h2>
        <button class="btn primary" id="play" type="button">Start CTF</button>
      </div>
      <div class="bar big" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress"><span></span></div>
      <p class="muted" id="progress-text" style="margin-top:10px"></p>
      <p class="form-msg error" id="play-msg" role="alert"></p>
    </section>
    <div class="grid cols-2">
      <section class="panel" aria-labelledby="next-h"><h2 id="next-h">Current objective</h2><div id="current"></div></section>
      <section class="panel" aria-labelledby="act-h"><h2 id="act-h">Recent activity</h2><ul class="activity" id="activity"></ul></section>
    </div>
  </main>
</body>
</html>
