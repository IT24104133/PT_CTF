<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | rootCapture</title>
  <meta name="theme-color" content="#02060d">
  <link rel="icon" href="/platform/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/platform/platform.css">
  <script src="/platform/common.js" defer></script>
  <script src="/platform/profile.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="page-head"><div><h1>Profile</h1><p>Your account and security settings.</p></div></div>
    <div class="grid cols-2">
      <section class="panel" aria-labelledby="acct-h">
        <h2 id="acct-h">Account</h2>
        <dl class="grid" id="account" style="margin:0"></dl>
      </section>
      <section class="panel" aria-labelledby="pw-h">
        <h2 id="pw-h">Change password</h2>
        <form class="form" id="pw-form" novalidate>
          <div class="field"><label for="cur">Current password</label><input id="cur" name="currentPassword" type="password" autocomplete="current-password" required><span class="err" data-for="currentPassword"></span></div>
          <div class="field"><label for="new">New password</label><input id="new" name="newPassword" type="password" autocomplete="new-password" required><span class="help">At least 10 characters.</span><span class="err" data-for="newPassword"></span></div>
          <p class="form-msg" id="pw-msg" role="alert"></p>
          <button class="btn primary" type="submit">Update password</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
